<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="AnnoMaster — AI-assisted annotation for YOLO datasets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#1b1145"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frameClip"><rect x="700" y="60" width="440" height="280" rx="14"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }

      @keyframes float  { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
      @keyframes pulse  { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      @keyframes scan   { 0% { transform: translateX(-120px) } 100% { transform: translateX(470px) } }
      @keyframes tag1   { 0%,4% { opacity: 0 } 8%,30% { opacity: 1 } 34%,100% { opacity: 0 } }
      @keyframes tag2   { 0%,37% { opacity: 0 } 41%,63% { opacity: 1 } 67%,100% { opacity: 0 } }
      @keyframes tag3   { 0%,70% { opacity: 0 } 74%,96% { opacity: 1 } 100% { opacity: 0 } }
      /* each box: appears as a dashed SUGGESTION, then becomes a solid CONFIRMED box */
      @keyframes sugg   { 0%,8% { opacity: 0 } 14%,44% { opacity: 1 } 48%,100% { opacity: 0 } }
      @keyframes conf   { 0%,46% { opacity: 0 } 50%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
      @keyframes dash   { to { stroke-dashoffset: -40 } }
      @keyframes blink  { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

      .floaty { animation: float 6s ease-in-out infinite; }
      .glow   { animation: pulse 5s ease-in-out infinite; }
      .scan   { animation: scan 3.2s linear infinite; }
      .t1 { animation: tag1 9s ease-in-out infinite; }
      .t2 { animation: tag2 9s ease-in-out infinite; }
      .t3 { animation: tag3 9s ease-in-out infinite; }
      .s  { animation: sugg 7s ease-in-out infinite; }
      .c  { animation: conf 7s ease-in-out infinite; }
      .d2 { animation-delay: .6s; }
      .d3 { animation-delay: 1.2s; }
      .ants { stroke-dasharray: 7 5; animation: dash 1.2s linear infinite; }
      .cursor { animation: blink 1s step-end infinite; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <circle class="glow" cx="230" cy="90" r="260" fill="url(#glow1)"/>
  <circle class="glow" cx="980" cy="330" r="260" fill="url(#glow2)" style="animation-delay:2.5s"/>

  <!-- ── left: logo + title ───────────────────────────────── -->
  <g transform="translate(70,92)">
    <!-- logo mark: corner brackets around a target -->
    <g stroke="url(#title)" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M0 16V0H16"/><path d="M44 0H60V16"/><path d="M60 44V60H44"/><path d="M16 60H0V44"/>
    </g>
    <circle cx="30" cy="30" r="9" fill="url(#title)"/>
    <circle cx="30" cy="30" r="17" fill="none" stroke="#a78bfa" stroke-opacity=".5" stroke-width="2"/>

    <text x="82" y="46" font-size="54" font-weight="800" fill="url(#title)" letter-spacing="-1">AnnoMaster</text>
  </g>

  <text x="72" y="196" font-size="23" font-weight="600" fill="#e2e8f0">AI-assisted image annotation for YOLO datasets</text>

  <!-- rotating taglines -->
  <g font-size="18" fill="#94a3b8" class="mono">
    <text class="t1" x="72" y="240"><tspan fill="#38bdf8">›</tspan> Smart Detect with your own YOLO models<tspan class="cursor" fill="#38bdf8">▍</tspan></text>
    <text class="t2" x="72" y="240"><tspan fill="#a78bfa">›</tspan> SAM3 text &amp; box prompting<tspan class="cursor" fill="#a78bfa">▍</tspan></text>
    <text class="t3" x="72" y="240"><tspan fill="#34d399">›</tspan> Only human-confirmed labels are exported<tspan class="cursor" fill="#34d399">▍</tspan></text>
  </g>

  <!-- chips -->
  <g font-size="13" font-weight="600">
    <g transform="translate(72,282)">
      <rect width="96" height="30" rx="15" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/>
      <text x="48" y="20" text-anchor="middle" fill="#7dd3fc">YOLO</text>
    </g>
    <g transform="translate(180,282)">
      <rect width="96" height="30" rx="15" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/>
      <text x="48" y="20" text-anchor="middle" fill="#c4b5fd">SAM3</text>
    </g>
    <g transform="translate(288,282)">
      <rect width="96" height="30" rx="15" fill="#f0abfc" fill-opacity=".12" stroke="#f0abfc" stroke-opacity=".5"/>
      <text x="48" y="20" text-anchor="middle" fill="#f5d0fe">DINOv2</text>
    </g>
    <g transform="translate(396,282)">
      <rect width="116" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/>
      <text x="58" y="20" text-anchor="middle" fill="#6ee7b7">GPU · CPU</text>
    </g>
  </g>

  <!-- ── right: mock annotation canvas ─────────────────────── -->
  <g class="floaty">
    <!-- window -->
    <rect x="700" y="30" width="440" height="310" rx="14" fill="#0b1226" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="722" cy="46" r="5" fill="#f87171"/><circle cx="740" cy="46" r="5" fill="#fbbf24"/><circle cx="758" cy="46" r="5" fill="#34d399"/>
    <text x="920" y="50" font-size="12" fill="#64748b" text-anchor="middle" class="mono">frame_0042.jpg</text>

    <g clip-path="url(#frameClip)">
      <!-- scene -->
      <rect x="700" y="60" width="440" height="280" fill="#131c38"/>
      <rect x="700" y="250" width="440" height="90" fill="#1a2547"/>
      <path d="M700 250 L790 170 L860 220 L940 140 L1040 230 L1140 180 V250 Z" fill="#17214280"/>
      <!-- person 1 -->
      <g fill="#3b4b7a"><circle cx="772" cy="182" r="15"/><rect x="752" y="200" width="40" height="72" rx="14"/></g>
      <!-- person 2 -->
      <g fill="#3b4b7a"><circle cx="862" cy="196" r="13"/><rect x="845" y="212" width="34" height="62" rx="12"/></g>
      <!-- excavator -->
      <g fill="#4a5a8c">
        <rect x="950" y="216" width="120" height="44" rx="6"/>
        <rect x="975" y="186" width="54" height="34" rx="5"/>
        <path d="M1068 222 L1110 170 L1124 178 L1086 232 Z"/>
        <path d="M1104 166 L1130 160 L1128 186 Z"/>
        <rect x="944" y="258" width="132" height="16" rx="8" fill="#2c3963"/>
      </g>

      <!-- AI scan line -->
      <rect class="scan" x="700" y="60" width="120" height="280" fill="url(#scan)" opacity=".55"/>

      <!-- box 1: person -->
      <g class="s">
        <rect class="ants" x="746" y="160" width="52" height="118" rx="3" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-width="2.5"/>
        <rect x="746" y="140" width="88" height="18" rx="4" fill="#fbbf24"/>
        <text x="752" y="153" font-size="11" font-weight="700" fill="#1e1b0f" class="mono">person 0.94</text>
      </g>
      <g class="c">
        <rect x="746" y="160" width="52" height="118" rx="3" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-width="2.5"/>
        <rect x="746" y="140" width="88" height="18" rx="4" fill="#34d399"/>
        <text x="752" y="153" font-size="11" font-weight="700" fill="#052e1f" class="mono">person ✓</text>
      </g>

      <!-- box 2: person -->
      <g class="s d2">
        <rect class="ants" x="840" y="178" width="44" height="100" rx="3" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-width="2.5"/>
        <rect x="840" y="298" width="88" height="18" rx="4" fill="#fbbf24"/>
        <text x="846" y="311" font-size="11" font-weight="700" fill="#1e1b0f" class="mono">person 0.88</text>
      </g>
      <g class="c d2">
        <rect x="840" y="178" width="44" height="100" rx="3" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-width="2.5"/>
        <rect x="840" y="298" width="88" height="18" rx="4" fill="#34d399"/>
        <text x="846" y="311" font-size="11" font-weight="700" fill="#052e1f" class="mono">person ✓</text>
      </g>

      <!-- box 3: excavator -->
      <g class="s d3">
        <rect class="ants" x="938" y="152" width="196" height="128" rx="3" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-width="2.5"/>
        <rect x="938" y="132" width="110" height="18" rx="4" fill="#fbbf24"/>
        <text x="944" y="145" font-size="11" font-weight="700" fill="#1e1b0f" class="mono">excavator 0.91</text>
      </g>
      <g class="c d3">
        <rect x="938" y="152" width="196" height="128" rx="3" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-width="2.5"/>
        <rect x="938" y="132" width="110" height="18" rx="4" fill="#a78bfa"/>
        <text x="944" y="145" font-size="11" font-weight="700" fill="#1c1236" class="mono">excavator ✓</text>
      </g>
    </g>

    <!-- legend -->
    <g font-size="12" class="mono">
      <rect x="716" y="352" width="14" height="14" rx="3" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="738" y="363" fill="#94a3b8">AI suggestion</text>
      <rect x="860" y="352" width="14" height="14" rx="3" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="882" y="363" fill="#94a3b8">human-confirmed</text>
    </g>
  </g>
</svg>

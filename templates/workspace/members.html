<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members – AnnoMaster</title>
  {% set page_css = ['css/layout.css', 'css/workspace.css'] %}
  {% include 'layout/head_assets.html' %}
</head>
<body>
{% include 'layout/navbar.html' %}

<div class="members-page">
  <div class="members-container">

    <div class="members-header">
      <a href="/" class="btn btn-secondary btn-sm">← Dashboard</a>
      <div>
        <h1 id="ws-members-title" class="ui-page-title">Members</h1>
        <p class="ui-page-subtitle" id="ws-members-subtitle"></p>
      </div>
    </div>

    <!-- Invite form (owners only) -->
    <div class="invite-card" id="invite-card" style="display:none">
      <h3>Invite a Member</h3>
      <div class="invite-form">
        <input class="form-input" id="invite-email" type="email" placeholder="colleague@example.com">
        <select class="form-select" id="invite-role" style="width:auto">
          <option value="editor">Editor – can annotate &amp; upload</option>
          <option value="viewer">Viewer – read only</option>
        </select>
        <button class="btn btn-primary" onclick="MembersFeature.invite()">Invite</button>
      </div>
      <div id="invite-error"></div>
      <div id="invite-success"></div>
    </div>

    <!-- Members list -->
    <div class="members-card">
      <h3>Current Members</h3>
      <div id="members-list" class="members-list">
        <div class="loading-state">Loading members…</div>
      </div>
    </div>

  </div>
</div>

<script src="{{ asset('js/core/api.js') }}"></script>
<script src="{{ asset('js/core/state.js') }}"></script>
<script src="{{ asset('js/core/utils.js') }}"></script>
<script src="{{ asset('js/features/auth.js') }}"></script>
<script src="{{ asset('js/features/workspace.js') }}"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const user = await AuthFeature.requireAuth();
    if (!user) return;
    document.getElementById('user-name').textContent = user.username;
    document.getElementById('user-avatar').textContent = user.username[0].toUpperCase();
    document.getElementById('user-menu').style.display = 'flex';

    // Get workspace_id from URL — works for both /workspace/123/members and ?workspace_id=123
    const parts  = location.pathname.split('/').filter(Boolean);
    const wsId   = parts[1] || new URLSearchParams(location.search).get('workspace_id') || '';
    if (!wsId) { document.body.innerHTML += '<p style="padding:calc(2rem * var(--space-scale));color:red">No workspace ID in URL.</p>'; return; }
    await MembersFeature.load(wsId, user);
  });
</script>
</body>
</html>
